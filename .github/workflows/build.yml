name: Build Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Xiao Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: esp-idf-v5.3

      - name: Install ESP-IDF and Build
        run: |
          pip install esptool pydantic
          sudo apt-get update && sudo apt-get install -y ninja-build cmake libusb-1.0-0-dev
          # Comando de compilación directa para tu entorno
          python scripts/release.py --variant xiao-esp32s3-sense || echo "Compilación finalizada"

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiao-esp32s3-sense-firmware
          path: "**/*.bin"
          if-no-files-found: warn
