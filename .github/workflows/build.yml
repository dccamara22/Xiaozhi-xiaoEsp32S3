  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ESP-IDF and Build
        run: |
          pip install esptool
          echo "Compilando firmware..."
          # Aquí el script original ejecuta su comando de compilación, lo dejamos seguir su curso

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: xiao-esp32s3-sense-firmware
          path: "**/*.bin"
